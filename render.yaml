services:
  - type: web
    name: ethiopian-smallholder-crop-yield
    runtime: python
    plan: free
    buildCommand: pip install -r app/requirements.txt
    startCommand: gunicorn --chdir app --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
